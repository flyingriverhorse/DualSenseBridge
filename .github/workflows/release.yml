name: Build release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install hidapi pystray pillow pyinstaller
          # vgamepad only ships as source, and its setup.py launches the ViGEmBus installer
          # and waits for it - that hangs forever on a headless runner. The package itself is
          # plain Python + ViGEmClient.dll, so unpack it into vendor/ instead of installing it.
          $info = Invoke-RestMethod https://pypi.org/pypi/vgamepad/0.1.0/json
          $sdist = ($info.urls | Where-Object packagetype -eq "sdist").url
          Invoke-WebRequest $sdist -OutFile vgamepad.tar.gz
          tar -xzf vgamepad.tar.gz
          New-Item -ItemType Directory -Force -Path vendor | Out-Null
          Move-Item vgamepad-0.1.0/vgamepad vendor/vgamepad
          "PYTHONPATH=$PWD\vendor" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # (importing vgamepad here would fail: it connects to the ViGEmBus driver on import,
          # and the runner has no driver. The exe connects at runtime on the user's PC.)
          if (-not (Test-Path vendor/vgamepad/win/vigem/client/x64/ViGEmClient.dll)) { throw "vgamepad unpack failed" }
          Write-Host "vgamepad unpacked"

      - name: Build exe
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed --uac-admin
          --name DualSenseBridge --icon assets/icon.ico
          --add-data "profiles.json;." --add-data "assets/icon.ico;assets"
          --paths src --paths vendor
          --hidden-import vgamepad --hidden-import vgamepad.win
          --hidden-import vgamepad.win.virtual_gamepad --hidden-import vgamepad.win.vigem_client
          --hidden-import vgamepad.win.vigem_commons
          --add-binary "vendor/vgamepad/win/vigem/client/x64/ViGEmClient.dll;vgamepad/win/vigem/client/x64"
          --hidden-import pystray._win32
          src/app.py

      - name: Download driver installers
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/get_drivers.ps1

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          $version = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME.TrimStart("v") } else { "0.0.0-dev" }
          & $iscc "/DAppVersion=$version" installer/DualSenseBridge.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path portable | Out-Null
          Copy-Item dist/DualSenseBridge.exe, profiles.json, README.md, LICENSE portable/
          Compress-Archive -Path portable/* -DestinationPath DualSenseBridge-portable-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: DualSenseBridge
          path: |
            dist/DualSenseBridge-Setup.exe
            DualSenseBridge-portable-x64.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/DualSenseBridge-Setup.exe
            DualSenseBridge-portable-x64.zip
          generate_release_notes: true
