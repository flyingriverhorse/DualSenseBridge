name: Build release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build exe
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed --uac-admin
          --name DualSenseBridge --icon assets/icon.ico
          --add-data "profiles.json;." --add-data "assets/icon.ico;assets"
          --collect-all vgamepad --hidden-import pystray._win32
          --paths src src/app.py

      - name: Download driver installers
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/get_drivers.ps1

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          $version = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME.TrimStart("v") } else { "0.0.0-dev" }
          & $iscc "/DAppVersion=$version" installer/DualSenseBridge.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path portable | Out-Null
          Copy-Item dist/DualSenseBridge.exe, profiles.json, README.md, LICENSE portable/
          Compress-Archive -Path portable/* -DestinationPath DualSenseBridge-portable-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: DualSenseBridge
          path: |
            dist/DualSenseBridge-Setup.exe
            DualSenseBridge-portable-x64.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/DualSenseBridge-Setup.exe
            DualSenseBridge-portable-x64.zip
          generate_release_notes: true
